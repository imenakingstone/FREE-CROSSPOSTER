<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">FREE CROSSPOSTER — Create once. Show up everywhere.</title>
<desc id="desc">Plan, organize and publish social content from one workspace.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#17283a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7f47a"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a4f06b" stop-opacity=".24"/><stop offset="1" stop-color="#a4f06b" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1010" cy="130" r="260" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="110" cy="560" r="230" fill="url(#glow)" filter="url(#blur)"/>
<g transform="translate(86 78)">
  <rect width="66" height="66" rx="19" fill="url(#accent)"/>
  <path d="M13 23h29l-7-7m7 7-7 7M53 43H24l7-7m-7 7 7 7M18 33h30" fill="none" stroke="#102013" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="43" fill="#f2f7ee" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="3">FREE CROSSPOSTER</text>
</g>
<g transform="translate(88 250)">
  <text x="0" y="0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="68" font-weight="800">Create once.</text>
  <text x="0" y="88" fill="#b7f47a" font-family="Arial,sans-serif" font-size="68" font-weight="800">Show up everywhere.</text>
  <text x="2" y="158" fill="#c5d0df" font-family="Arial,sans-serif" font-size="26">Plan, organize and publish your social content</text>
  <text x="2" y="198" fill="#c5d0df" font-family="Arial,sans-serif" font-size="26">from one calm, powerful workspace.</text>
</g>
<g transform="translate(90 548)" font-family="Arial,sans-serif" font-size="18" font-weight="700">
  <rect width="128" height="42" rx="21" fill="#202c42"/><text x="64" y="27" fill="#f7f8fc" text-anchor="middle">INSTAGRAM</text>
  <rect x="142" width="96" height="42" rx="21" fill="#202c42"/><text x="190" y="27" fill="#f7f8fc" text-anchor="middle">TIKTOK</text>
  <rect x="252" width="110" height="42" rx="21" fill="#202c42"/><text x="307" y="27" fill="#f7f8fc" text-anchor="middle">YOUTUBE</text>
</g>
